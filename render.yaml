services:
  - type: web
    name: career-connect-school-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_APP_ENV
        value: demo
      - key: VITE_DEMO_MODE
        value: "true"
      - key: VITE_ENABLE_REAL_APPLICATIONS
        value: "false"
      - key: VITE_ENABLE_CV_UPLOADS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
